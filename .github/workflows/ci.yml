name: Project Depot CI
on: [push, pull_request]
jobs:
  check-structure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Verify mandatory files
        run: |
          test -f README.md
          test -f .gitignore
          test -f LICENSE
          echo "Все обязательные файлы присутствуют!"
